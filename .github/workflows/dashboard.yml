name: Refresh dashboard and prepare Pages

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: economic-cycle-radar-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: python -m pip install -e ".[dev]"
      - name: Fetch live FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python -m economic_cycle_radar.cli
          --output dashboard/public/data/dashboard-data.json
          --raw-dir data/raw
      - run: pytest
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
        working-directory: dashboard
      - name: Build dashboard
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build
        working-directory: dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          if-no-files-found: error
      - uses: actions/configure-pages@v6
        if: vars.ENABLE_PAGES == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: vars.ENABLE_PAGES == 'true'
        with:
          path: dashboard/dist

  deploy:
    if: vars.ENABLE_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

